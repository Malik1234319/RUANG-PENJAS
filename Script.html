<script>

   STATE
===================================================== */

const state = {
  token: null,
  user: null,
  classes: [],
  settings: {},
  currentClass: ''
};


/* =====================================================
   GOOGLE SCRIPT RUNNER
===================================================== */

function server(functionName, ...args) {

  return new Promise(function(resolve, reject) {

    showLoading(true);

    const runner =
      google.script.run
        .withSuccessHandler(function(result) {
          showLoading(false);
          resolve(result);
        })
        .withFailureHandler(function(error) {
          showLoading(false);
          reject(error);
        });

    runner[functionName](...args);
  });
}


/* =====================================================
   START
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    initializeLogin();
  }
);


async function initializeLogin() {

  try {

    const data = await server('setupApp');

    const appData =
      await server('getAppDataForLogin');

  } catch (error) {

    // Normal jika belum login.
  }

  loadLoginClasses();
}


async function loadLoginClasses() {

  try {

    const result =
      await server('getAppData', '');

    // Jika tidak ada session,
    // getAppData akan error.

  } catch (error) {

    // Tidak masalah.
  }

  const classes =
    [
      '1A',
      '1B',
      '1C',
      '5A',
      '5B',
      '6A',
      '6B'
    ];

  const select =
    document.getElementById('siswaKelas');

  select.innerHTML =
    classes.map(function(kelas) {

      return `
        <option value="${kelas}">
          ${kelas}
        </option>
      `;

    }).join('');
}


/* =====================================================
   LOGIN SWITCH
===================================================== */

function switchLogin(type) {

  const guru =
    document.getElementById('loginGuru');

  const siswa =
    document.getElementById('loginSiswa');

  const tabGuru =
    document.getElementById('tabGuru');

  const tabSiswa =
    document.getElementById('tabSiswa');

  if (type === 'guru') {

    guru.style.display = 'block';
    siswa.style.display = 'none';

    tabGuru.classList.add('active');
    tabSiswa.classList.remove('active');

  } else {

    guru.style.display = 'none';
    siswa.style.display = 'block';

    tabGuru.classList.remove('active');
    tabSiswa.classList.add('active');
  }

  clearLoginMessage();
}


/* =====================================================
   LOGIN GURU
===================================================== */

async function loginGuru() {

  const username =
    document.getElementById('guruUsername').value.trim();

  const password =
    document.getElementById('guruPassword').value;

  if (!username || !password) {

    showLoginMessage(
      'Username dan password wajib diisi.',
      true
    );

    return;
  }

  try {

    const result =
      await server(
        'loginTeacher',
        username,
        password
      );

    enterApp(result);

  } catch (error) {

    showLoginMessage(
      error.message || 'Login gagal.',
      true
    );
  }
}


/* =====================================================
   LOGIN SISWA
===================================================== */

async function loginSiswa() {

  const nama =
    document.getElementById('siswaNama').value.trim();

  const kelas =
    document.getElementById('siswaKelas').value;

  if (!nama || !kelas) {

    showLoginMessage(
      'Nama dan kelas wajib diisi.',
      true
    );

    return;
  }

  try {

    const result =
      await server(
        'loginStudent',
        nama,
        kelas
      );

    enterApp(result);

  } catch (error) {

    showLoginMessage(
      error.message || 'Login gagal.',
      true
    );
  }
}


/* =====================================================
   ENTER APP
===================================================== */

async function enterApp(result) {

  state.token = result.token;
  state.user = result.user;

  document.getElementById(
    'loginPage'
  ).style.display = 'none';

  document.getElementById(
    'appPage'
  ).style.display = 'flex';

  document.getElementById(
    'userName'
  ).textContent = state.user.nama;

  document.getElementById(
    'userRole'
  ).textContent = state.user.role;

  try {

    const data =
      await server(
        'getAppData',
        state.token
      );

    state.classes = data.classes;
    state.settings = data.settings;

  } catch (error) {

    state.classes =
      [
        '1A',
        '1B',
        '1C',
        '5A',
        '5B',
        '6A',
        '6B'
      ];
  }

  if (state.user.role === 'Siswa') {

    state.currentClass =
      state.user.kelas;

  } else {

    state.currentClass =
      state.classes[0] || '1A';
  }

  renderMenu();

  showView('dashboard');
}

/* =====================================================

===================================================== */

async function showView(view) {

    .querySelectorAll('.nav-item')

        'active',
        item.dataset.menu === view

    });

    dashboard: 'Dashboard',
    siswa: 'Data Siswa',
    import: 'Impor Data Siswa',
    curriculum: 'CP / TP / KKTP',
    prota: 'Program Tahunan',
    promes: 'Program Semester',
    jurnal: 'Jurnal Mengajar',
    nilai: 'Asesmen / Nilai',
    remedial: 'Remedial / Pengayaan',
    laporan: 'Laporan Nilai'
  };

  document.getElementById(
    'pageTitle'
  ).textContent = titles[view] || 'RUANG PENJAS';


  switch(view) {

    case 'dashboard':
      await renderDashboard();
      break;

    case 'siswa':
      await renderStudents();
      break;

    case 'import':
      renderImport();
      break;

    case 'curriculum':
      await renderCurriculum();
      break;

    case 'prota':

      break;

      break;

}

async function loadStudentsTable() {

    document.getElementById(
      'studentClass'

  state.currentClass = kelas;

  try {

    const rows =
      await server(
        'getStudents',
        state.token,
        kelas
      );

    const html =
      rows.length
      ? `

        <div class="panel">

          <div class="table-wrapper">

            <table>

              <thead>

                <tr>

                  <th>No</th>
                  <th>Nama</th>
                  <th>Kelas</th>
                  <th>NISN</th>
                  <th>JK</th>
                  <th>Orang Tua</th>
                  <th>WhatsApp</th>
                  <th>Aksi</th>

                </tr>

              </thead>

              <tbody>

                ${rows.map(function(row, i) {

                  return `

                    <tr>

                      <td>${i + 1}</td>

                      <td>
                        ${escapeHtml(row.Nama)}
                      </td>

                      <td>
                        ${escapeHtml(row.Kelas)}
                      </td>

                      <td>
                        ${escapeHtml(row.NISN || '-')}
                      </td>

                      <td>
                        ${escapeHtml(row.JenisKelamin || '-')}
                      </td>

                      <td>
                        ${escapeHtml(row.NamaOrangTua || '-')}
                      </td>

                      <td>
                        ${escapeHtml(row.NoWAOrangTua || '-')}
                      </td>

                      <td>

                        ${
                          row.NoWAOrangTua
                          ? `
                            <button
                              class="btn btn-success"
                              onclick="openWhatsApp(
                                '${row.ID}'
                              )">

                              🟢 WA

                            </button>
                          `
                          : `
                            <span class="badge badge-warning">
                              Belum ada WA
                            </span>
                          `
                        }

                        <button
                          class="btn btn-danger"
                          onclick="deleteData(
                            'siswa',
                            '${row.ID}'
                          )">

                          🗑️

                        </button>

                      </td>

                    </tr>

                  `;

                }).join('')}

              </tbody>

            </table>

          </div>

        </div>

      `
      : `

        <div class="panel">

          <p>
            Belum ada data siswa untuk kelas
            <strong>${escapeHtml(kelas)}</strong>.
          </p>

        </div>

      `;

    document.getElementById(
      'studentsTable'
    ).innerHTML = html;

  } catch (error) {

    showToast(
      error.message,
      true
    );
  }
}

async function loadTemplate() {

  try {

    const template =
      await server(
        'getImportTemplate'
      );

    document.getElementById(
      'importData'
    ).value = template;

  } catch (error) {

    showToast(
      error.message,
      true
    );
  }
}


async function importStudentData() {

  const text =
    document.getElementById(
      'importData'
    ).value.trim();

  if (!text) {

    showToast(
      'Data impor masih kosong.',
      true
    );

    return;
  }

  if (
    !confirm(
      'Impor data siswa sekarang?'
    )
  ) {
    return;
  }

  try {

    const result =
      await server(
        'importStudents',
        state.token,
        text
      );

    document.getElementById(
      'importResult'
    ).innerHTML = `

      <div class="panel">

        <h3>✅ Hasil Impor</h3>

        <p>
          Total data:
          <strong>${result.total}</strong>
        </p>

        <p>
          Berhasil:
          <strong>${result.berhasil}</strong>
        </p>

        <p>
          Duplikat:
          <strong>${result.duplikat}</strong>
        </p>

        <p>
          Gagal:
          <strong>${result.gagal}</strong>
        </p>

        ${
          result.detail.length
          ? `
            <hr>
            ${result.detail.join('<br>')}
          `
          : ''
        }

      </div>

    `;

    showToast(
      'Impor siswa berhasil.'
    );

  } catch (error) {

    showToast(
      error.message,
      true
    );
  }
}


function downloadTemplate() {

  const content =
`Nama Siswa,Kelas,NISN,Jenis Kelamin,Nama Orang Tua,No WA,Status
Ahmad Fajar,6A,1234567890,L,Bapak Ahmad,08123456789,Aktif
Siti Aisyah,6A,1234567891,P,Ibu Siti,08129876543,Aktif`;

  const blob =
    new Blob(
      [content],
      {type: 'text/csv;charset=utf-8;'}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement('a');

  a.href = url;
  a.download =
    'Template_Import_Siswa_RUANG_PENJAS.csv';

  a.click();

  URL.revokeObjectURL(url);
}


/* =====================================================
   WHATSAPP
===================================================== */

async function openWhatsApp(studentId) {

  const message =
    prompt(
      'Pesan WhatsApp untuk orang tua:',
      'Assalamu\'alaikum Bapak/Ibu. Kami dari Guru PJOK SD Negeri 206 Palembang menyampaikan informasi terkait perkembangan pembelajaran PJOK putra/putri Bapak/Ibu. Terima kasih.'
    );

  if (message === null) return;

  try {

    const result =
      await server(
        'getWhatsAppLink',
        state.token,
        studentId,
        message
      );

    window.open(
      result.url,
      '_blank'
    );

  } catch (error) {

    showToast(
      error.message,
      true
    );
  }
}

async function loadAssessmentStudents() {

      );

                  data-nisn="${escapeHtml(row.NISN || '')}"

}

async function loadReportTable() {

      ).value;

  state.currentClass = kelas;

  try {

        'getReport',
        state.token,

    document.getElementById(
      'reportTable'
    ).innerHTML = `

      <div class="panel">

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>No</th>
                <th>Nama</th>
                <th>NISN</th>
                <th>Asesmen</th>
                <th>Rata-rata</th>
                <th>Status</th>
                ${
                  state.user.role !== 'Siswa'
                  ? '<th>WhatsApp</th>'
                  : ''
                }

              </tr>

            </thead>

            <tbody>

              ${
                rows.map(function(row, i) {

                  let badge =
                    'badge-info';

                  if (
                    row.status === 'Tuntas'
                  ) {
                    badge =
                      'badge-success';
                  }

                  if (
                    row.status === 'Remedial'
                  ) {
                    badge =
                      'badge-danger';
                  }

                  return `

                    <tr>

                      <td>${i + 1}</td>

                      <td>
                        ${escapeHtml(row.nama)}
                      </td>

                      <td>
                        ${escapeHtml(row.nisn || '-')}
                      </td>

                      <td>
                        ${row.jumlahAsesmen}
                      </td>

                      <td>
                        <strong>
                          ${row.rataRata}
                        </strong>
                      </td>

                      <td>

                        <span class="badge ${badge}">
                          ${row.status}
                        </span>

                      </td>

                      ${
                        state.user.role !== 'Siswa'
                        ? `
                          <td>

                            ${
                              row.noWAOrangTua
                              ? `
                                <button
                                  class="btn btn-success"
                                  onclick="openWhatsApp('${row.id}')">

                                  🟢 WA

                                </button>
                              `
                              : '-'
                            }

                          </td>
                        `
                        : ''
                      }

                    </tr>

                  `;

                }).join('')
              }

            </tbody>

          </table>

        </div>

      </div>

    `;

  } catch (error) {

    showToast(
      error.message,
      true
    );

/* =====================================================
   GENERIC TABLE
===================================================== */

async function loadModuleTable(
  module,
  elementId
) {

  try {

    const rows =
      await server(
        'getModuleData',
        state.token,
        module,
        state.currentClass
      );

    if (!rows.length) {

      document.getElementById(
        elementId
      ).innerHTML = `

        <div class="panel">

          <p>
            Belum ada data.
          </p>

        </div>

      `;

      return;
    }

    const fields =
      Object.keys(rows[0])
        .filter(function(key) {

          return key !== 'ID';

        })
        .slice(0, 8);


    document.getElementById(
      elementId
    ).innerHTML = `

      <div class="panel">

        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                ${fields.map(function(field) {

                  return `
                    <th>
                      ${escapeHtml(field)}
                    </th>
                  `;

                }).join('')}

                <th>Aksi</th>

              </tr>

            </thead>


            <tbody>

              ${rows.slice(0, 100).map(function(row) {

                return `

                  <tr>

                    ${fields.map(function(field) {

                      return `
                        <td>
                          ${escapeHtml(
                            String(row[field] ?? '')
                              .substring(0, 150)
                          )}
                        </td>
                      `;

                    }).join('')}


                    <td>

                      <button
                        class="btn btn-danger"
                        onclick="deleteData(
                          '${module}',
                          '${row.ID}'
                        )">

                        🗑️

                      </button>

                    </td>

                  </tr>

                `;

              }).join('')}

            </tbody>

          </table>

        </div>

      </div>

    `;

  } catch (error) {

    showToast(
      error.message,
      true
    );
  }
}

async function deleteData(
  module,
  id
) {

  if (
    !confirm(
      'Hapus data ini?'
    )
  ) {
    return;
  }

  try {

    await server(
      'deleteRecord',
      state.token,
      module,
      id
    );

    showToast(
      'Data berhasil dihapus.'
    );

    await showView(
      module === 'siswa'
        ? 'siswa'
        : module
    );

  } catch (error) {

    showToast(
      error.message,
      true
    );
  }
}

/* =====================================================
   UI HELPERS
===================================================== */

function showLoading(show) {

  document.getElementById(
    'loading'
  ).style.display =
    show ? 'flex' : 'none';
}


function showToast(
  message,
  error = false
) {

  const toast =
    document.getElementById('toast');

  toast.textContent =
    message || 'Selesai';

  toast.style.display =
    'block';

  toast.style.background =
    error
      ? '#dc2626'
      : '#0f172a';

  setTimeout(function() {

    toast.style.display =
      'none';

  }, 3500);
}


function showLoginMessage(
  message,
  error
) {

  const el =
    document.getElementById(
      'loginMessage'
    );

  el.textContent = message;

  el.className =
    'message ' +
    (error
      ? 'error'
      : 'success');
}


function clearLoginMessage() {

  const el =
    document.getElementById(
      'loginMessage'
    );

  el.textContent = '';
}


function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function toggleSidebar() {

  document
    .querySelector('.sidebar')
    .classList.toggle('show');
}
