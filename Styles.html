<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background: #f4f7fb;
  color: #1f2937;
}


/* =========================================
   LOGIN
========================================= */

.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(
      135deg,
      #0f766e,
      #2563eb
    );
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 22px;
  padding: 32px;
  box-shadow:
    0 20px 50px rgba(0,0,0,.20);
}

.logo-circle {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: #eff6ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  margin: auto;
}

.login-card h1 {
  text-align: center;
  margin: 15px 0 5px;
}

.login-subtitle {
  text-align: center;
  color: #64748b;
  margin-top: 0;
}

.login-tabs {
  display: flex;
  gap: 8px;
  margin: 25px 0;
}

.login-tab {
  flex: 1;
  border: 0;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  background: #eef2f7;
}

.login-tab.active {
  background: #2563eb;
  color: white;
}


/* =========================================
   FORM
========================================= */

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 14px;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  padding: 11px 12px;
  font-size: 14px;
  background: white;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: #2563eb;
}


/* =========================================
   BUTTON
========================================= */

.btn {
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  cursor: pointer;
  font-weight: 600;
  margin: 3px;
}

.btn-primary {
  background: #2563eb;
  color: white;
}

.btn-success {
  background: #16a34a;
  color: white;
}

.btn-warning {
  background: #f59e0b;
  color: white;
}

.btn-danger {
  background: #dc2626;
  color: white;
}

.btn-secondary {
  background: #64748b;
  color: white;
}

.btn-full {
  width: 100%;
  margin: 5px 0;
}


/* =========================================
   APP
========================================= */

.app-page {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 250px;
  background: #0f172a;
  color: white;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  z-index: 100;
}

.brand {
  padding: 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}

.brand-icon {
  font-size: 30px;
}

.brand strong {
  display: block;
}

.brand small {
  color: #94a3b8;
  display: block;
  margin-top: 4px;
}

.sidebar nav {
  padding: 12px;
  overflow-y: auto;
}

.nav-item {
  width: 100%;
  background: transparent;
  color: #cbd5e1;
  border: 0;
  padding: 12px 14px;
  border-radius: 9px;
  text-align: left;
  cursor: pointer;
  margin-bottom: 4px;
  font-size: 14px;
}

.nav-item:hover,
.nav-item.active {
  background: #1e40af;
  color: white;
}

.sidebar-bottom {
  margin-top: auto;
  padding: 15px;
}

.logout-btn {
  width: 100%;
  border: 0;
  padding: 12px;
  border-radius: 9px;
  background: #dc2626;
  color: white;
  cursor: pointer;
}


/* =========================================
   MAIN
========================================= */

.main-content {
  margin-left: 250px;
  width: calc(100% - 250px);
}

.topbar {
  height: 65px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  border-bottom: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  z-index: 50;
}

#pageTitle {
  font-size: 20px;
  font-weight: 700;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.role-badge {
  background: #dbeafe;
  color: #1d4ed8;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}

.content {
  padding: 25px;
}

.mobile-menu {
  display: none;
  border: 0;
  background: none;
  font-size: 24px;
}


/* =========================================
   DASHBOARD
========================================= */

.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.page-heading h2 {
  margin: 0;
}

.card-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.stat-card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  border: 1px solid #e5e7eb;
}

.stat-icon {
  font-size: 25px;
}

.stat-label {
  color: #64748b;
  font-size: 13px;
  margin-top: 8px;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  margin-top: 4px;
}

.panel {
  background: white;
  border-radius: 14px;
  border: 1px solid #e5e7eb;
  padding: 20px;
  margin-bottom: 20px;
}

.panel h3 {
  margin-top: 0;
}


/* =========================================
   TABLE
========================================= */

.table-wrapper {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th,
td {
  padding: 10px 12px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
  font-size: 13px;
}

th {
  background: #f8fafc;
  font-weight: 700;
}

tr:hover td {
  background: #f8fafc;
}


/* =========================================
   FORM GRID
========================================= */

.form-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.form-grid .full {
  grid-column: 1 / -1;
}


/* =========================================
   BADGES
========================================= */

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}

.badge-success {
  background: #dcfce7;
  color: #166534;
}

.badge-danger {
  background: #fee2e2;
  color: #991b1b;
}

.badge-warning {
  background: #fef3c7;
  color: #92400e;
}

.badge-info {
  background: #dbeafe;
  color: #1e40af;
}


/* =========================================
   IMPORT
========================================= */

.import-box {
  background: #eff6ff;
  border: 2px dashed #60a5fa;
  border-radius: 14px;
  padding: 20px;
}

.import-box textarea {
  min-height: 220px;
  font-family: monospace;
  font-size: 12px;
}

.import-help {
  background: white;
  border-radius: 10px;
  padding: 15px;
  margin-top: 15px;
  font-size: 13px;
}


/* =========================================
   MESSAGE
========================================= */

.message {
  margin-top: 12px;
  text-align: center;
  font-size: 13px;
}

.message.error {
  color: #dc2626;
}

.message.success {
  color: #16a34a;
}


/* =========================================
   TOAST
========================================= */

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: #0f172a;
  color: white;
  padding: 13px 18px;
  border-radius: 10px;
  display: none;
  z-index: 999;
}


/* =========================================
   LOADING
========================================= */

.loading {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,.75);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.spinner {
  width: 30px;
  height: 30px;
  border: 4px solid #dbeafe;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width: 800px) {

  .sidebar {
    transform: translateX(-100%);
    transition: .25s;
  }

  .sidebar.show {
    transform: translateX(0);
  }

  .main-content {
    margin-left: 0;
    width: 100%;
  }

  .mobile-menu {
    display: inline-block;
  }

  .content {
    padding: 15px;
  }

  .topbar {
    padding: 0 15px;
  }

  .user-info {
    font-size: 12px;
  }
}

</style>
